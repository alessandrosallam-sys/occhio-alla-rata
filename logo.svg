<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" color="#ffffff" role="img" aria-labelledby="titolo-logo">
  <title id="titolo-logo">Occhio alla Rata</title>
  <!-- Il logo di Occhio alla Rata: un gufo vigile con gli occhi d'oro. Sbatte le palpebre e ogni tanto inclina la testa;
       con «riduci movimento» nelle impostazioni del sistema resta fermo. Lo stesso disegno è in loghi.js (logo «gufo»),
       insieme agli altri loghi che si possono scegliere nelle impostazioni. -->
  <defs>
    <linearGradient id="sfondo-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c6ef5"/><stop offset="1" stop-color="#7048e8"/></linearGradient>
    <radialGradient id="oro-logo" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ffe680"/><stop offset="0.55" stop-color="#f7b500"/><stop offset="1" stop-color="#d48a00"/></radialGradient>
  </defs>
  <style>
    .testa { transform-box: view-box; transform-origin: 32px 52px; }
    .palpebra { transform-box: fill-box; transform-origin: center; }
    @keyframes logo-batte { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.08); } }
    @keyframes logo-inclina { 0%, 70%, 100% { transform: none; } 76%, 84% { transform: rotate(-7deg); } 90% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: no-preference) {
      .palpebra { animation: logo-batte 4.5s 0.8s infinite; }
      .testa { animation: logo-inclina 8s 1.5s ease-in-out infinite; }
    }
  </style>
  <rect width="64" height="64" rx="16" fill="url(#sfondo-logo)"/>
  <g class="testa">
    <path d="M16.5 21 15 9.5l9.5 6.5M47.5 21 49 9.5 39.5 16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M14.5 26c0-8.5 7.7-12.5 17.5-12.5S49.5 17.5 49.5 26v16.5c0 8.5-7.7 12.5-17.5 12.5S14.5 51 14.5 42.5Z" fill="currentColor" opacity="0.28"/>
    <path d="M14.5 26c0-8.5 7.7-12.5 17.5-12.5S49.5 17.5 49.5 26v16.5c0 8.5-7.7 12.5-17.5 12.5S14.5 51 14.5 42.5Z" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M24.5 45.5q2.2 2.4 4.4 0M30 48q2 2.4 4 0M35.1 45.5q2.2 2.4 4.4 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" opacity="0.8"/>
    <g class="palpebra">
      <circle cx="24.5" cy="29" r="7.8" fill="#ffffff"/><circle cx="39.5" cy="29" r="7.8" fill="#ffffff"/>
      <circle cx="24.5" cy="29" r="4.4" fill="url(#oro-logo)"/><circle cx="24.5" cy="29" r="2" fill="#1e1b4b"/><circle cx="23.4" cy="27.8" r="0.9" fill="#ffffff"/>
      <circle cx="39.5" cy="29" r="4.4" fill="url(#oro-logo)"/><circle cx="39.5" cy="29" r="2" fill="#1e1b4b"/><circle cx="38.4" cy="27.8" r="0.9" fill="#ffffff"/>
    </g>
    <path d="M29.8 35.5h4.4L32 40.2Z" fill="#f7b500"/>
  </g>
  <path d="M26.5 55v3.5M29.5 55v3.5M34.5 55v3.5M37.5 55v3.5" stroke="#f7b500" stroke-width="2.2" stroke-linecap="round"/>
</svg>
